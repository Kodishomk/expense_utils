[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kodishomk"
version = "0.1.0"
authors = [
  { name="Kodishomk", email="your-email@example.com" },
]
description = "A lightweight utility package for calculating, filtering, and evaluating expenses against budget limits."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["finance", "expenses", "budgeting", "calculator"]

[project.urls]
"Homepage" = "https://github.com/Kodishomk/expense_utils"
"Bug Tracker" = "https://github.com/Kodishomk/expense_utils/issues"